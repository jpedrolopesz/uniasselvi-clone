name: Vitru golden set
on:
  pull_request:
    paths:
      - "vitru/vitru-voice/pipecat_app/**"
      - "vitru/vitru-voice/scripts/golden_set.py"
      - "lib/vitru/**"
      - "components/vitru/**"
  workflow_dispatch:
jobs:
  nova-micro:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: vitru/vitru-voice } }
    permissions: { id-token: write, contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_BEDROCK_GOLDEN_ROLE_ARN }}
          aws-region: us-east-1
      - run: UV_PROJECT_ENVIRONMENT=.venv-ci uv run --frozen python scripts/golden_set.py --backend bedrock --ci --summary-only
